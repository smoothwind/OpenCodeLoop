appId: com.qiuyj.opencodeloop
productName: OpenCodeLoop
directories:
  output: dist
files:
  - out/**
  - resources/**
  - package.json
win:
  icon: resources/icon.png
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
