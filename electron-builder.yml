appId: com.qiuyj.opencodeloop
productName: OpenCodeLoop
directories:
  output: dist
files:
  - out/**
  - resources/**
  - package.json
  # 渲染层已由 Vite 打包，运行时不需要 node_modules（vue 仅作为构建期依赖）
  - '!node_modules/**'
compression: maximum
afterPack: ./scripts/after-pack.mjs
publish:
  provider: github
  owner: smoothwind
  repo: OpenCodeLoop
artifactName: ${productName}-Setup-${version}.${ext}
win:
  # 预生成 ICO（256×256 PNG 项）：绕开 electron-builder 图标工具的 WASM 转换，
  # 该工具在部分环境（如 Node 24）稳定报 WebAssembly.Memory 分配失败
  icon: build/icon.ico
  # Electron 自带 55 种语言包（约 48 MB），本项目界面只有中文；保留中英文即可
  electronLanguages:
    - zh-CN
    - en-US
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  # 卸载不删除 %APPDATA%\opencodeloop：重装后保留任务、预设与设置
  deleteAppDataOnUninstall: false
